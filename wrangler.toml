name = "whoami"
main = "worker/whoami-worker.js"
compatibility_date = "2026-09-07"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true


# Routes and custom domains for this Worker are managed in the Cloudflare
# dashboard (Workers & Pages -> whoami -> Settings -> Domains & Routes) and
# are intentionally not duplicated here, so connecting Git-based builds
# doesn't overwrite what's already configured.